<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini Pokedex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Mini Pokédex</h1>

  <input type="text" id="inputPokemon" placeholder="Ej: pikachu">
  <button onclick="buscarPokemon()">Buscar</button>

  <p id="loading" class="hidden">Cargando...</p>
  <p id="error" class="error"></p>

  <div id="card" class="hidden">
    <h2 id="nombre"></h2>
    <img id="imagen">
    <p id="tipo"></p>
    <p id="peso"></p>
    <p id="altura"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
